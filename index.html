<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>The Marketplace — Clean Calm v3.5</title>
<meta name="theme-color" content="#0ea55a"/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app" id="appHeader">
    <div class="headerWrap">
      <div class="brandRow">
        <button class="icon-btn" data-action="toggle-nav" aria-label="Open menu" title="Menu">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>

        <a class="brandLink" href="#home" data-action="goto" data-route="home" aria-label="Go to Home">
          <div class="brandStack">
            <div class="brandTitle" role="heading" aria-level="1">THE MARKETPLACE</div>
            <div class="brandSub">LUSAKA</div>
          </div>
        </a>

        <div class="headerActions">
          <button class="icon-btn" data-action="goto" data-route="cart" aria-label="Open cart" style="position:relative">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2" aria-hidden="true">
              <path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="21" r="1.5"/><circle cx="18" cy="21" r="1.5"/>
            </svg>
            <span id="cartBubble" class="cart-bubble hidden" aria-hidden="true">0</span>
          </button>
        </div>
      </div>

      <div class="searchRow">
        <div class="searchBar">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2" aria-hidden="true">
            <path d="M21 21l-4.35-4.35"/><circle cx="10" cy="10" r="7"/>
          </svg>
          <input id="globalSearchInputHeader" type="search" inputmode="search" placeholder="Search products across all categories…" autocomplete="off"/>
          <button class="btn info" id="globalSearchGoHeader" aria-label="Search now">Search</button>
        </div>
        <div id="typeahead" class="typeahead hidden" role="listbox" aria-label="Suggestions"></div>
      </div>
    </div>

    <div id="navPanel" class="navPanel" role="dialog" aria-label="Main menu" aria-hidden="true">
      <div class="navPanelInner">
        <div class="menuSection">
          <div class="menuTitle">Quick Links</div>
          <div class="menuGrid">
            <button class="menuItem" data-action="goto" data-route="home">
              <span class="miIcon">🏠</span><span>Home</span>
            </button>
            <button class="menuItem" data-action="goto" data-route="cart">
              <span class="miIcon">🛒</span><span>Cart</span>
            </button>
            <button class="menuItem" data-action="goto" data-route="search">
              <span class="miIcon">🔎</span><span>Search</span>
            </button>
          </div>
        </div>

        <div class="menuSection">
          <div class="menuTitle">Browse Categories</div>
          <div id="menuCats" class="menuCats"></div>
        </div>
      </div>
    </div>

    <div class="catsBarWrap">
      <div id="catsBar" class="catsBar" role="tablist" aria-label="Categories">
        </div>
    </div>

    <div class="divider" aria-hidden="true"></div>
  </header>

  <div id="a11yLive" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <main id="app"></main>

  <footer class="appFooter">
    <div class="footerCard">
      <strong style="font-family:Poppins">Tips</strong>
      <ul style="margin:8px 0 0 18px;color:#475569">
        <li>Use “Compare” to weigh price, distance, ETA and delivery fee.</li>
        <li>Heavy items? Choose a closer store for easier delivery.</li>
        <li>Mobile money accepted: MTN, Airtel, Zamtel.</li>
      </ul>
    </div>
  </footer>

  <nav class="bottom dim" role="navigation" aria-label="Primary" id="bottomNav">
    <button class="nav-btn" data-action="goto" data-route="home" id="navHome" aria-label="Home">
      <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="2" aria-hidden="true"><path d="M3 12l9-9 9 9"/><path d="M9 21V9h6v12"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-btn" data-action="goto" data-route="search" id="navSearch" aria-label="Search">
      <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="2" aria-hidden="true"><path d="M21 21l-4.35-4.35"/><circle cx="10" cy="10" r="7"/></svg>
      <span>Search</span>
    </button>
  </nav>

  <div id="modal" class="modal" aria-modal="true" role="dialog" aria-labelledby="modalTitle">
    <div class="modalCard">
      <button class="modalClose" data-action="close-modal" aria-label="Close">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
